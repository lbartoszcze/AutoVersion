[package]
name = "autoversion"
# No version is written here: the released version is the git tag, as before.
edition = "2021"
description = "One versioning rule, shared by repositories that have nothing else in common"
license = "MIT"
repository = "https://github.com/lbartoszcze/AutoVersion"
autotests = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "autoversion"
path = "src/main.rs"
required-features = ["cli"]

# Every command of the autoversion binary, driven as a person or a script runs it.
[[test]]
name = "cli"
path = "tests/cli/main.rs"
required-features = ["cli"]

# docs/FIXTURES.md, the contract between ports, held against the built binary.
[[test]]
name = "conformance"
path = "tests/conformance/main.rs"
required-features = ["cli"]

# `surface` and `check` reading Python packages: every __all__ and module-binding refusal.
[[test]]
name = "python"
path = "tests/python/main.rs"
required-features = ["cli"]

# The rule's edges and every required flag through `autoversion decide` and the other commands.
[[test]]
name = "rule"
path = "tests/rule/main.rs"
required-features = ["cli"]

# The rule needs only serde_json. The Python surface reader, which the
# autoversion binary uses and a product that extracts its own surface does
# not, is the `surfaces` feature: a consumer taking the rule alone depends on
# this crate with `default-features = false` and compiles no parser. The
# binary is the `cli` feature: the surface reader, and the wisent-errors
# envelope every refusal of the binary prints, which the library never does.
[features]
default = ["cli"]
cli = ["surfaces", "dep:wisent-errors"]
surfaces = ["dep:tree-sitter", "dep:tree-sitter-python"]

[dependencies]
serde_json = "1"
tree-sitter = { version = "0.25", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
# The fleet's failure envelope: every refusal of the binary is a cause
# src/errors declares, printed on stderr after its sentence.
wisent-errors = { git = "https://github.com/wisent-ai/wisent-errors", version = "1.0.0", optional = true }
